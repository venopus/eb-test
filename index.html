<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЭБ — офлайн-тренажёр</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --text:#e8eaf0; --muted:#8b93a7; --ok:#2ecc71; --bad:#ff5c5c; --accent:#ffc107; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 18px 14px 60px; }
  h1 { font-size: 20px; margin: 6px 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tabs button { flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; font-size:14px; }
  .tabs button.on { background:var(--accent); color:#111; border-color:var(--accent); font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .q { font-size:17px; margin-bottom:14px; }
  .meta { color:var(--muted); font-size:13px; margin-bottom:10px; }
  .opt { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; cursor:pointer; }
  .opt.ok { border-color: var(--ok); background: rgba(46,204,113,.08); }
  .opt.bad { border-color: var(--bad); background: rgba(255,92,92,.08); }
  .row { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .btn { padding:10px 16px; border-radius:10px; border:1px solid var(--line); background:#20242e; color:var(--text); cursor:pointer; font-size:14px; }
  .btn.primary { background:var(--accent); color:#111; border-color:var(--accent); font-weight:600; }
  .btn:disabled { opacity:.45; cursor:default; }
  .fb { margin-top:12px; font-size:14px; }
  .fb.ok { color: var(--ok); }
  .fb.bad { color: var(--bad); }
  .score { font-size:18px; margin:10px 0; }
  .list-item { border-bottom:1px solid var(--line); padding:12px 0; }
  .list-q { font-weight:600; margin-bottom:6px; }
  .list-opt { color:var(--muted); font-size:14px; padding:2px 0; }
  .list-opt.c { color: var(--ok); }
  .search { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:#12151b; color:var(--text); margin-bottom:12px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>...ЭБ — офлайн-тренажёр</h1>
  <div class="sub">156 вопросов · ПОТЭЭ · прогресс сохраняется</div>

  <div class="tabs">
    <button id="tabTest" class="on">Тест</button>
    <button id="tabAll">Все вопросы</button>
  </div>

  <div id="testView">
    <div class="card">
      <div class="meta" id="counter"></div>
      <div class="q" id="question"></div>
      <div id="options"></div>
      <div class="fb" id="feedback"></div>
      <div class="row">
        <button class="btn primary" id="checkBtn">Проверить</button>
        <button class="btn" id="nextBtn" disabled>Далее</button>
        <button class="btn" id="resetBtn">Начать заново</button>
      </div>
    </div>
    <div class="card hidden" id="resultCard">
      <div class="score" id="score"></div>
      <div class="row"><button class="btn primary" id="restartBtn">Заново</button></div>
    </div>
  </div>

  <div id="allView" class="hidden">
    <input class="search" id="search" placeholder="Поиск по вопросам…">
    <div class="card" id="allList"></div>
  </div>
</div>

const KEY = 'eb_quiz_v1';
let state = { order: [], pos: 0, score: 0, answers: {} };
let answered = false;

function shuffle(a) { for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.order) || s.order.length !== DATA.length) return null;
    if (typeof s.pos !== 'number' || s.pos < 0 || s.pos >= s.order.length) return null;
    if (!s.answers) s.answers = {};
    return s;
  } catch (e) { return null; }
}

function reset() {
  try { localStorage.removeItem(KEY); } catch (e) {}
  state = { order: shuffle(DATA.map((_, i) => i)), pos: 0, score: 0, answers: {} };
  document.getElementById('resultCard').classList.add('hidden');
  document.querySelector('#testView .card').classList.remove('hidden');
  save();
  render();
}

function start() {
  const saved = load();
  state = saved || { order: shuffle(DATA.map((_, i) => i)), pos: 0, score: 0, answers: {} };
  if (!saved) save();
  document.getElementById('resultCard').classList.add('hidden');
  document.querySelector('#testView .card').classList.remove('hidden');
  render();
}

function applyChecked(item, ans) {
  document.querySelectorAll('#options .opt').forEach((label, idx) => {
    const input = label.querySelector('input');
    if (item.c.includes(idx)) label.classList.add('ok');
    else if (ans.picked.includes(idx)) label.classList.add('bad');
    input.disabled = true;
  });
  document.getElementById('feedback').textContent = item.c.length
    ? (ans.right ? 'Верно' : 'Неверно. Правильные варианты подсвечены.')
    : 'Правильный ответ не распознан — сверься с первоисточником.';
  document.getElementById('feedback').className = 'fb ' + (ans.right && item.c.length ? 'ok' : 'bad');
  document.getElementById('checkBtn').disabled = true;
  document.getElementById('nextBtn').disabled = false;
  answered = true;
}

function render() {
  answered = false;
  const item = DATA[state.order[state.pos]];
  const ans = state.answers[state.order[state.pos]];

  document.getElementById('counter').textContent = 'Вопрос ' + (state.pos + 1) + ' из ' + state.order.length;
  document.getElementById('question').textContent = item.q;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'fb';
  document.getElementById('checkBtn').disabled = false;
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('nextBtn').textContent = state.pos === state.order.length - 1 ? 'Результат' : 'Далее';

  const box = document.getElementById('options');
  box.innerHTML = '';
  item.o.forEach((text, idx) => {
    const label = document.createElement('label');
    label.className = 'opt';
    const input = document.createElement('input');
    input.type = item.t === 'single' ? 'radio' : 'checkbox';
    input.name = 'opt';
    input.value = idx;
    if (ans && ans.picked.includes(idx)) input.checked = true;
    const span = document.createElement('span');
    span.textContent = text;
    label.appendChild(input);
    label.appendChild(span);
    box.appendChild(label);
  });

  if (ans && ans.done) applyChecked(item, ans);
}

function check() {
  if (answered) return;
  const item = DATA[state.order[state.pos]];
  const picked = [...document.querySelectorAll('#options input:checked')].map(i => Number(i.value));
  const correct = item.c;
  const right = picked.length === correct.length && picked.every(v => correct.includes(v));
  state.answers[state.order[state.pos]] = { picked: picked, right: right, done: true };
  if (right) state.score++;
  save();
  applyChecked(item, { picked: picked, right: right });
}

function next() {
  if (state.pos < state.order.length - 1) {
    state.pos++;
    save();
    render();
    return;
  }
  document.querySelector('#testView .card').classList.add('hidden');
  document.getElementById('resultCard').classList.remove('hidden');
  document.getElementById('score').textContent = 'Результат: ' + state.score + ' из ' + state.order.length;
  save();
}

function renderAll(filter) {
  const f = (filter || '').trim().toLowerCase();
  const list = document.getElementById('allList');
  list.innerHTML = '';
  DATA.forEach((item, i) => {
    if (f && !(item.q.toLowerCase().includes(f) || item.o.join(' ').toLowerCase().includes(f))) return;
    const div = document.createElement('div');
    div.className = 'list-item';
    const q = document.createElement('div');
    q.className = 'list-q';
    q.textContent = (i+1) + '. ' + item.q;
    div.appendChild(q);
    item.o.forEach((text, idx) => {
      const o = document.createElement('div');
      o.className = 'list-opt' + (item.c.includes(idx) ? ' c' : '');
      o.textContent = (item.c.includes(idx) ? '✓ ' : '• ') + text;
      div.appendChild(o);
    });
    list.appendChild(div);
  });
}

document.getElementById('checkBtn').onclick = check;
document.getElementById('nextBtn').onclick = next;
document.getElementById('resetBtn').onclick = reset;
document.getElementById('restartBtn').onclick = reset;
document.getElementById('tabTest').onclick = () => {
  document.getElementById('tabTest').classList.add('on');
  document.getElementById('tabAll').classList.remove('on');
  document.getElementById('testView').classList.remove('hidden');
  document.getElementById('allView').classList.add('hidden');
};
document.getElementById('tabAll').onclick = () => {
  document.getElementById('tabAll').classList.add('on');
  document.getElementById('tabTest').classList.remove('on');
  document.getElementById('allView').classList.remove('hidden');
  document.getElementById('testView').classList.add('hidden');
  renderAll(document.getElementById('search').value);
};
document.getElementById('search').oninput = (e) => renderAll(e.target.value);

start();
</script>
